# Alert rules — the "error rate spikes and latency degradation" the project plan asks for, plus the
# availability signal that makes both of them interpretable.
#
# There is no Alertmanager in this stack: a firing alert is visible in Prometheus (:9090/alerts) and
# in Grafana's Alerting > Alert rules view, which is the whole notification story a local portfolio
# stack needs. Routing to email/Slack/PagerDuty is a receiver's job and belongs with a real
# environment, not with docker-compose.
#
# Ratio alerts are all guarded by a minimum request rate. Without it, one failed request during an
# idle night is a 100% error rate and every alert here would be permanently firing.
#
# Feature 2.4 — Distributed Telemetry & Observability, Milestone E (TELEMETRY_PHASE2_PLAN.md §6).

groups:
  # ---------------------------------------------------------------------------------------------
  # Availability. Built on the blackbox probes of Milestone C's endpoints, not on the OTLP metrics:
  # a killed container reports nothing, and nothing is what an idle container reports too.
  # ---------------------------------------------------------------------------------------------
  - name: fooddeliveryservice-availability
    interval: 15s
    rules:
      - alert: ServiceDown
        expr: probe_success{job="health-live"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.service }} is not answering its liveness probe'
          description: >-
            GET {{ $labels.instance }} has failed for over a minute. The process is gone, wedged or
            unreachable — this is not a dependency problem, /health/live never fails on a dependency.

      - alert: ServiceNotReady
        # Up but unready: the interesting half of the liveness/readiness split. Under Kubernetes this
        # is a pod that has been pulled from rotation; here it means one of Postgres, Redis, RabbitMQ
        # or Duende is unreachable from that host.
        expr: |
          probe_success{job="health-ready"} == 0
            and on (service) probe_success{job="health-live"} == 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.service }} is live but not ready'
          description: >-
            A dependency check is failing. GET {{ $labels.instance }} names the one that is down.
            Note that all six module hosts probe Duende, so an Identity outage shows up here as a
            fleet-wide event by design (docs/health-probe-contract.md).

  # ---------------------------------------------------------------------------------------------
  # Errors. Two different questions, deliberately kept apart: what the caller saw (HTTP status) and
  # what the application did (the Result a handler returned, plus anything that threw).
  # ---------------------------------------------------------------------------------------------
  - name: fooddeliveryservice-errors
    interval: 15s
    rules:
      - alert: HighHttpErrorRate
        expr: |
          100 * sum by (service_name) (
            rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m])
          )
          / sum by (service_name) (rate(http_server_request_duration_seconds_count[5m])) > 5
          and sum by (service_name) (rate(http_server_request_duration_seconds_count[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.service_name }} is answering 5xx to {{ printf "%.1f" $value }}% of requests'
          description: >-
            Server-side failures over the last 5 minutes. Open the RED dashboard for the failing
            route, then pivot to the trace via the correlation id on the response.

      - alert: HighApplicationExceptionRate
        # app.request.failures{error.type="exception"} is the one class of error that never shows up
        # as a business failure: ExceptionHandlingPipelineBehavior rethrows, so these are bugs and
        # infrastructure faults, not rejected commands.
        expr: |
          100 * sum by (service_name) (rate(app_request_failures_total{error_type="exception"}[5m]))
          / sum by (service_name) (rate(app_requests_total[5m])) > 5
          and sum by (service_name) (rate(app_requests_total[5m])) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: '{{ $labels.service_name }} is throwing on {{ printf "%.1f" $value }}% of requests'
          description: >-
            Commands and queries that threw rather than returning a failure Result. Seq, filtered by
            ServiceName, has the exception; the RED dashboard's failure panel has the request type.

  # ---------------------------------------------------------------------------------------------
  # Latency. Both layers again: the transport histogram includes middleware, model binding and the
  # response write; the application histogram is the handler pipeline alone. A gap between them is
  # itself the finding.
  # ---------------------------------------------------------------------------------------------
  - name: fooddeliveryservice-latency
    interval: 15s
    rules:
      - alert: HighHttpLatencyP95
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, service_name) (rate(http_server_request_duration_seconds_bucket[5m]))
          ) > 1
          and sum by (service_name) (rate(http_server_request_duration_seconds_count[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.service_name }} p95 latency is {{ printf "%.2f" $value }}s'
          description: >-
            95th percentile HTTP latency above one second for five minutes. Check the cache hit-rate
            dashboard first — a collapsed hit rate on user_permissions puts a MassTransit round trip
            to Users on every single request.

      - alert: SlowApplicationRequests
        # Per request type, not per service: a slow GetOrdersQuery and a slow PlaceOrderCommand have
        # nothing to do with each other, and the aggregate hides whichever is rarer.
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, service_name, request) (rate(app_request_duration_seconds_bucket[5m]))
          ) > 1
          and sum by (service_name, request) (rate(app_requests_total[5m])) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: '{{ $labels.request }} p95 is {{ printf "%.2f" $value }}s in {{ $labels.service_name }}'
          description: >-
            The handler pipeline itself is slow, so the cause is inside the application — a query, a
            lock wait or an outbound call — rather than in the host or the proxy.

  # ---------------------------------------------------------------------------------------------
  # Under load (Feature 3.5, Milestone E). These fire only while a k6 run is streaming into this
  # Prometheus, which is what makes them useful: the rules above are tuned to survive an idle night
  # and are correspondingly slow and forgiving, and a load test is neither. Gating on `k6_vus`
  # buys a tighter threshold and a shorter window without making the general alerts noisy.
  #
  # It also answers a question a portfolio stack cannot otherwise answer — do these alerts work
  # under real conditions, or only when a container is killed by hand?
  # ---------------------------------------------------------------------------------------------
  - name: fooddeliveryservice-loadtest
    interval: 15s
    rules:
      - alert: PlatformDegradedUnderLoad
        # 1%, not 5%: it is the same number the harness's own `http_req_failed` threshold uses, so
        # this firing and the run failing are the same event seen from the two ends.
        expr: |
          100 * sum(rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[2m]))
          / sum(rate(http_server_request_duration_seconds_count[2m])) > 1
          and on () sum(k6_vus) > 0
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: '{{ printf "%.1f" $value }}% of requests are 5xx while a load test is running'
          description: >-
            The platform is past the point where it can serve the offered load. Read it next to the
            fds-load dashboard's client-against-server panel: if the client p95 has separated from
            the server p95, the queue is in front of the application and the run has found the knee.

      - alert: LoadGeneratorSaturated
        # Not a platform alert at all, and that is the point of having it: dropped iterations mean
        # k6 could not find a free VU, so the offered load is no longer the load in the profile and
        # every number after this moment describes the generator. Milestone D's method says read
        # this before blaming the platform; this makes it impossible to miss.
        expr: sum(rate(k6_dropped_iterations_total[2m])) > 0.1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: 'The load generator is dropping {{ printf "%.2f" $value }} iterations/s'
          description: >-
            k6 could not start iterations at the profile's arrival rate. Raise the VU allocation
            (`secondsPerIteration` in scenarios/mixed.js) or run the generator off-host — until then
            the offered load is below the profile and the results understate both throughput and
            saturation.

  # ---------------------------------------------------------------------------------------------
  # Money (Feature 3.8, Milestone I). The only group here whose failure mode is a customer's card
  # rather than a request: everything above degrades service, these degrade revenue and trust.
  #
  # The split between the first two rules is the whole point of the `reason` tag. A card declined
  # for want of funds is the customer's business and no amount of paging fixes it; a run of
  # `gateway_error` is ours — a rejected API key, a malformed request, an unmapped Stripe error —
  # and it means the platform is refusing orders it could have taken.
  # ---------------------------------------------------------------------------------------------
  - name: fooddeliveryservice-payments
    interval: 15s
    rules:
      - alert: HighPaymentFailureRate
        # Guarded at 0.01/s — roughly 36 attempts an hour. Payments are a far thinner stream than
        # HTTP requests, so the 0.05 floor the groups above use would silence this for most of a
        # normal day.
        expr: |
          100 * sum(rate(payments_failed_total[15m]))
          / (sum(rate(payments_failed_total[15m])) + sum(rate(payments_authorized_total[15m]))) > 25
          and sum(rate(payments_authorized_total[15m]) + rate(payments_failed_total[15m])) > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: '{{ printf "%.1f" $value }}% of card authorizations are failing'
          description: >-
            A quarter of placements are not getting a hold on the card, over fifteen minutes. Break
            it down by `reason` on the business dashboard before doing anything: a lopsided
            insufficient_funds or card_declined share is the customer base, not an incident, and only
            gateway_error and no_payment_method point back at this platform.

      - alert: PaymentGatewayErrors
        # No ratio and no floor: a single unmapped Stripe error is a bug, and the bucket is narrow
        # enough that a sustained rate of them is never normal.
        expr: sum(rate(payments_failed_total{reason="gateway_error"}[10m])) > 0.005
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: 'Card authorizations are failing for reasons that are ours, not the issuer''s'
          description: >-
            gateway_error is the bucket for a malformed request, a rejected API key or a Stripe error
            nothing maps — never a decline. Seq has the StripeError behind each one, filtered by
            ServiceName=FoodDeliveryService.Payments; check the Stripe key first.

      - alert: SlowPaymentGateway
        # Per operation, like SlowApplicationRequests: a refund and an authorize have nothing to do
        # with each other and the aggregate hides whichever is rarer.
        expr: |
          histogram_quantile(
            0.95,
            sum by (le, operation) (rate(payments_gateway_duration_seconds_bucket[10m]))
          ) > 5
          and sum by (operation) (rate(payments_gateway_duration_seconds_count[10m])) > 0.01
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Stripe {{ $labels.operation }} p95 is {{ printf "%.2f" $value }}s'
          description: >-
            The provider is slow, and an authorize sits on the order-placement path. Read it with the
            `outcome` series on the same panel: p95 rising only on `faulted` is the SDK retrying
            through an incident at Stripe, while all three rising together is the network in between.

      - alert: WebhookProcessingLag
        # The instrument this fires on exists because of this alert — §11.1 asked for the rule and
        # named no metric that could carry it.
        expr: |
          histogram_quantile(
            0.95,
            sum by (le) (rate(payments_webhook_lag_seconds_bucket[10m]))
          ) > 120
          and sum(rate(payments_webhook_lag_seconds_count[10m])) > 0.005
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: 'Stripe webhooks are waiting {{ printf "%.0f" $value }}s to be acted on'
          description: >-
            Verified provider events are queueing between the endpoint that recorded them and the
            outbox job that acts on them. This matters more here than an outbox backlog elsewhere:
            the webhook is the reconciling path that stands in for the retry neither the outbox nor
            the inbox job performs, so while it lags, a lost API response is an authorization nobody
            is going to finish.

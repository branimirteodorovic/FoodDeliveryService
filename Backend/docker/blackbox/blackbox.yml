# Blackbox exporter — turns the Milestone C health probes into a Prometheus series.
#
# It is the only thing in this stack that observes a service from outside its own process, which is
# why it is the signal a "service is down" alert can honestly be built on: the collector can only
# report what a running service told it.
#
# Feature 2.4 — Distributed Telemetry & Observability, Milestone E (TELEMETRY_PHASE2_PLAN.md §6).

modules:
  http_2xx:
    prober: http
    timeout: 5s
    http:
      method: GET
      # 200 only. /health/live and /health/ready answer 503 for both Degraded and Unhealthy
      # (docs/health-probe-contract.md), so anything that is not "send me traffic" fails the probe.
      valid_status_codes: [200]
      valid_http_versions: [HTTP/1.1, HTTP/2.0]
      follow_redirects: false
      preferred_ip_protocol: ip4

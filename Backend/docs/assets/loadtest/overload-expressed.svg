ons, zero health probes.</text><text x="28" y="536" font-family="ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif" font-size="11" fill="#656d76" text-anchor="start" font-weight="400">compose · 8 vCPU · generator co-located · loadtest/results/published/</text>
</svg>

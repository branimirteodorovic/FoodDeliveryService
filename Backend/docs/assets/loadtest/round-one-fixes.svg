-size="11" fill="#656d76" text-anchor="start" font-weight="400">Latency was never the point: the before run failed 0.40% of requests and 2.09% of order placements; the after run failed none</text><text x="28" y="378" font-family="ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif" font-size="11" fill="#656d76" text-anchor="start" font-weight="400">and completed more work on the same eight cores. The tail — p99, and the write path — is where bounded pools show up.</text><text x="28" y="396" font-family="ui-sans-serif, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif" font-size="11" fill="#656d76" text-anchor="start" font-weight="400">678 × PostgresException 53300 before · 0 after · loadtest/results/published/</text>

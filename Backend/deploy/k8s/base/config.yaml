# The config every host shares, in two objects.
#
# Splitting it this way is what keeps the nine Deployment files short: each one lists only what is
# genuinely its own (its database, its module settings) and pulls the rest in with `envFrom`. It is
# also the reason no password appears in a Deployment.
#
# Nothing here is a template or a placeholder — these are the working local-cluster values, the same
# ones docker-compose uses. They are safe to commit because they are only ever valid against a
# throwaway KinD cluster on your machine. A real environment replaces the Secret's contents (Azure
# Key Vault, sealed-secrets, `kubectl create secret` from a password manager) without touching a
# single Deployment, because the *keys* stay the same.
apiVersion: v1
kind: ConfigMap
metadata:
  name: platform-config
  namespace: fooddeliveryservice
  labels:
    app.kubernetes.io/part-of: fooddeliveryservice
data:
  # Not Development. Three behaviours flip with it and all three are intended in-cluster: the Redis
  # cache/lock in-memory fallback switches off (an unreachable Redis must fail readiness rather than
  # quietly become a per-pod "distributed" lock), the OpenAPI document is not mapped, and Serilog's
  # Seq sink — configured only in appsettings.Development.json — is absent, so pods log to console.
  ASPNETCORE_ENVIRONMENT: Kubernetes
  # HTTP only: no certificate lives in a pod, so ASPNETCORE_HTTPS_PORTS must stay unset or the host
  # fails to start. The Dockerfiles' EXPOSE 8081 is inert here.
  ASPNETCORE_HTTP_PORTS: "8080"

  # JWT validation, identical on all nine hosts (the Gateway validates, then each service validates
  # again). The first issuer is what Identity actually stamps into a token; the second is there for
  # tokens fetched from the host through the Identity NodePort, mirroring compose.
  Authentication__Audience: fooddeliveryservice.api
  Authentication__TokenValidationParameters__ValidIssuers__0: http://fooddeliveryservice-identity:8080
  Authentication__TokenValidationParameters__ValidIssuers__1: http://localhost:18080
  Authentication__MetadataAddress: http://fooddeliveryservice-identity:8080/.well-known/openid-configuration
  Authentication__RequireHttpsMetadata: "false"

  # The readiness dependency on Identity — the `Duende` health check every module host registers.
  Duende__HealthUrl: http://fooddeliveryservice-identity:8080/health

  # There is no OpenTelemetry Collector in this cluster. Left enabled, the OTLP exporter retries
  # against a dead endpoint every few seconds and buries the startup log. The observability stack
  # stays a docker-compose concern; delete this key and add the collector if you ever want it here.
  OTEL_SDK_DISABLED: "true"
---
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: fooddeliveryservice
  labels:
    app.kubernetes.io/part-of: fooddeliveryservice
type: Opaque
# stringData rather than data: Kubernetes base64-encodes it on the way in, so this file stays
# readable. Base64 is not encryption either way — the protection is that these values are worthless
# outside a local cluster.
stringData:
  # Shared by all seven module hosts — and, since Feature 3.5 Milestone G, by the Gateway, whose edge
  # rate limiter keeps its counters here so they survive a replica count above 1 (§5.4).
  ConnectionStrings__Cache: fooddeliveryservice-redis:6379
  ConnectionStrings__Queue: amqp://fooddeliveryservice-queue:5672

  # One database per service on the shared server (Hard Rule #5). Each Deployment maps exactly one
  # of these onto its own ConnectionStrings__Database, so no service can even name another's
  # database. The databases themselves are created by the postgres-init ConfigMap (Milestone C),
  # already owned by the right role — EF Migrate() only evolves a schema now.
  #
  # `Maximum Pool Size` is explicit and it is not decoration. Npgsql defaults to 100 per pool and
  # every module host builds two pools from this string — the shared NpgsqlDataSource for Dapper and
  # the outbox/inbox jobs, and EF Core's own — so eight unbounded hosts can demand 1,600 connections
  # from a server whose default ceiling is 100. Feature 3.5 Milestone F measured what that costs:
  # 192 `53300: sorry, too many clients already` in Orders alone inside one 3-minute ramp. Bounded,
  # the worst case is 7 × 20 + 20 = 160. **A replica count above 1 multiplies this** — two Orders
  # pods are 40 connections, not 20 — so raising replicas means revisiting this line and the
  # server's max_connections together (see KUBERNETES_PHASE2_PLAN.md §5.1).
  #
  # Feature 3.7 Milestone C adds a SECOND credential per service. `Database__*` is now the
  # least-privilege fds_{service}_app account every request-serving pool holds; `DatabaseMigrations__*`
  # is the fds_{service}_owner account, used by exactly one code path — app.ApplyMigrations() at
  # startup — and capped at 2 because that is all a single sequential migration run can want. The
  # arithmetic moves from 7 x 20 + 20 = 160 to 160 + 8 x 2 = 176, still inside the server's
  # max_connections=200 with room for psql and the seeder. Do not raise that 2: a large migration
  # pool is a privileged pool sitting idle for the life of the process. docs/security.md §4.
  Database__Identity: Host=fooddeliveryservice-database;Port=5432;Database=fooddeliveryservice_identity;Username=fds_identity_app;Password=fds_identity_app_dev;Maximum Pool Size=20
  DatabaseMigrations__Identity: Host=fooddeliveryservice-database;Port=5432;Database=fooddeliveryservice_identity;Username=fds_identity_owner;Password=fds_identity_owner_dev;Maximum Pool Size=2
  Database__Users: Host=fooddeliveryservice-database;Port=5432;Database=fooddeliveryservice_users;Username=fds_users_app;Password=fds_users_app_dev;Maximum Pool Size=10
  DatabaseMigrations__Users: Host=fooddeliveryservice-database;Port=5432;Database=fooddeliveryservice_users;Username=fds_users_owner;Password=fds_users_owner_dev;Maximum Pool Size=2
  Database__Orders: Host=fooddeliveryservice-database;Port=5432;Database=fooddeliveryservice_orders;Username=fds_orders_app;Password=fds_orders_app_dev;Maximum Pool Size=10
  DatabaseMigrations__Orders: Host=fooddeliveryservice-database;Port=5432;Database=fooddeliveryservice_orders;Username=fds_orders_owner;Password=fds_orders_owner_dev;Maximum Pool Size=2
  Database__Restaurants: Host=fooddeliveryservice-database;Port=5432;Database=fooddeliveryservice_restaurants;Username=fds_restaurants_app;Password=fds_restaurants_app_dev;Maximum Pool Size=10
  DatabaseMigrations__Restaurants: Host=fooddeliveryservice-database;Port=5432;Database=fooddeliveryservice_restaurants;Username=fds_restaurants_owner;Password=fds_restaurants_owner_dev;Maximum Pool Size=2
  Database__Delivery: Host=fooddeliveryservice-database;Port=5432;Database=fooddeliveryservice_delivery;Username=fds_delivery_app;Password=fds_delivery_app_dev;Maximum Pool Size=10
  DatabaseMigrations__Delivery: Host=fooddeliveryservice-database;Port=5432;Database=fooddeliveryservice_delivery;Username=fds_delivery_owner;Password=fds_delivery_owner_dev;Maximum Pool Size=2
  Database__Notifications: Host=fooddeliveryservice-database;Port=5432;Database=fooddeliveryservice_notifications;Username=fds_notifications_app;Password=fds_notifications_app_dev;Maximum Pool Size=10
  DatabaseMigrations__Notifications: Host=fooddeliveryservice-database;Port=5432;Database=fooddeliveryservice_notifications;Username=fds_notifications_owner;Password=fds_notifications_owner_dev;Maximum Pool Size=2
  Database__RealTime: Host=fooddeliveryservice-database;Port=5432;Database=fooddeliveryservice_realtime;Username=fds_realtime_app;Password=fds_realtime_app_dev;Maximum Pool Size=10
  DatabaseMigrations__RealTime: Host=fooddeliveryservice-database;Port=5432;Database=fooddeliveryservice_realtime;Username=fds_realtime_owner;Password=fds_realtime_owner_dev;Maximum Pool Size=2
  Database__Support: Host=fooddeliveryservice-database;Port=5432;Database=fooddeliveryservice_support;Username=fds_support_app;Password=fds_support_app_dev;Maximum Pool Size=10
  DatabaseMigrations__Support: Host=fooddeliveryservice-database;Port=5432;Database=fooddeliveryservice_support;Username=fds_support_owner;Password=fds_support_owner_dev;Maximum Pool Size=2

  # The client-credentials secret Users presents to Identity's api/users provisioning endpoint —
  # the one sanctioned service-to-service HTTP call in the system. Both sides read the same value,
  # so it is stored once. Registration fails at that call if it drifts.
  ConfidentialClientSecret: PzotcrvZRF9BHCKcUxdKfHWlIPECG49k

  # Identity's initial administrator. Must be >= 12 characters and reasonably strong: outside
  # Development, ASP.NET Identity applies its real password rules, so compose's `admin` would fail
  # to seed and leave you with no account to log in with. The length floor was 8 until Feature 3.7
  # Milestone E raised it to 12 — this value grew a character in the same change, and a seed that
  # fails the policy is silent: AdminSeeder logs the error and the host starts anyway, so the first
  # symptom is a login that cannot succeed.
  AdminSeed__Password: Admin!234567

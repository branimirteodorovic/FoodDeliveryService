# RabbitMQ — the MassTransit broker. Single node; a dev-cluster stand-in, not an HA cluster.
#
# Replicas of a service are competing consumers on a shared queue (the `instanceId` comes from the
# constant service name), so nothing here changes when Milestone F scales a host.
apiVersion: v1
kind: Service
metadata:
  name: fooddeliveryservice-queue
  namespace: fooddeliveryservice
  labels:
    app.kubernetes.io/name: fooddeliveryservice-queue
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: fooddeliveryservice
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fooddeliveryservice-queue
  ports:
    - name: amqp
      port: 5672
      targetPort: amqp
    - name: management
      port: 15672
      targetPort: management
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: fooddeliveryservice-queue
  namespace: fooddeliveryservice
  labels:
    app.kubernetes.io/name: fooddeliveryservice-queue
    app.kubernetes.io/component: broker
    app.kubernetes.io/part-of: fooddeliveryservice
spec:
  serviceName: fooddeliveryservice-queue
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fooddeliveryservice-queue
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fooddeliveryservice-queue
        app.kubernetes.io/component: broker
        app.kubernetes.io/part-of: fooddeliveryservice
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
      containers:
        - name: rabbitmq
          image: rabbitmq:4.0-management-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: amqp
              containerPort: 5672
            - name: management
              containerPort: 15672
          env:
            # Local KinD credentials only — Milestone B moves them into a Secret.
            - name: RABBITMQ_DEFAULT_USER
              value: guest
            - name: RABBITMQ_DEFAULT_PASS
              value: guest
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "check_port_connectivity"]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 10
          livenessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 60
            periodSeconds: 30
            timeoutSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/rabbitmq
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi

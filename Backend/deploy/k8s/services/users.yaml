# Users — registration, profiles and permissions. The only host that calls another service over
# HTTP (Identity's api/users provisioning endpoint), so it carries the Duende client-credentials
# settings the others do not need.
#
# Same shape as orders.yaml, which carries the explanatory comments for all of them.
apiVersion: v1
kind: Service
metadata:
  name: fooddeliveryservice-users-api
  namespace: fooddeliveryservice
  labels:
    app.kubernetes.io/name: fooddeliveryservice-users-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: fooddeliveryservice
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fooddeliveryservice-users-api
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fooddeliveryservice-users-api
  namespace: fooddeliveryservice
  labels:
    app.kubernetes.io/name: fooddeliveryservice-users-api
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: fooddeliveryservice
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fooddeliveryservice-users-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fooddeliveryservice-users-api
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: fooddeliveryservice
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
      containers:
        - name: users-api
          image: fooddeliveryservice/users-api:local-dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: platform-config
          env:
            - name: ConnectionStrings__Database
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: Database__Users
            # The DDL-capable fds_users_owner account, read by app.ApplyMigrations() at startup and
            # by nothing else. Kept out of ConnectionStrings__Database on purpose: that one is the
            # credential every request-serving pool holds. docs/security.md §4.
            - name: ConnectionStrings__DatabaseMigrations
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: DatabaseMigrations__Users
            - name: ConnectionStrings__Cache
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: ConnectionStrings__Cache
            - name: ConnectionStrings__Queue
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: ConnectionStrings__Queue
            # Registration calls Identity's local API to create the credentials before the Users
            # module persists its own record. These four addresses and the client-credentials pair
            # are what make that call work; get the secret wrong and registration fails at the one
            # sanctioned service-to-service HTTP hop in the system.
            - name: Duende__AdminUrl
              value: http://fooddeliveryservice-identity:8080/api/
            - name: Duende__TokenUrl
              value: http://fooddeliveryservice-identity:8080/connect/token
            - name: Duende__ConfidentialClientId
              value: fooddeliveryservice-confidential-client
            - name: Duende__ConfidentialClientSecret
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: ConfidentialClientSecret
            - name: Duende__PublicClientId
              value: fooddeliveryservice-public-client
            - name: Duende__Scope
              value: users:register
            # The module-side record for the administrator Identity seeds — same identity id on
            # both sides, which is what ties the two rows together.
            - name: AdminSeed__Email
              value: admin@fooddeliveryservice.com
            - name: AdminSeed__FirstName
              value: System
            - name: AdminSeed__LastName
              value: Administrator
            - name: AdminSeed__IdentityId
              value: 11111111-1111-1111-1111-111111111111
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 10
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

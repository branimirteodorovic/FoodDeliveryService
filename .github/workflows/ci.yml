name: CI

on:
  pull_request:
  push:
    branches: [development, main]
  # Lets the slow KinD cluster job be triggered by hand on any branch.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: Backend/FoodDeliveryService.Api.slnx

jobs:
  build-and-test:
    name: Build & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('Backend/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore "$SOLUTION"

      - name: Build
        run: dotnet build "$SOLUTION" --configuration Release --no-restore

      # Suites excluded here need the `fooddeliveryservice.identity` host on :18080 for real
      # Duende JWTs (Users, Orders, Restaurants, Delivery, RealTime integration tests). They are
      # re-enabled in Milestone G's KinD job, where Identity runs in the cluster.
      # Notifications' integration suite is purely event-driven, so it runs here on the runner's
      # Docker via Testcontainers.
      - name: Test (unit suites + Identity-independent integration suites)
        run: |
          set -euo pipefail
          projects=(
            "Backend/src/Common/FoodDeliveryService.Common.UnitTests/FoodDeliveryService.Common.UnitTests.csproj"
            "Backend/src/Modules/Delivery/FoodDeliveryService.Modules.Delivery.UnitTests/FoodDeliveryService.Modules.Delivery.UnitTests.csproj"
            "Backend/src/Modules/Notifications/FoodDeliveryService.Modules.Notifications.UnitTests/FoodDeliveryService.Modules.Notifications.UnitTests.csproj"
            "Backend/src/Modules/Orders/FoodDeliveryService.Modules.Orders.UnitTests/FoodDeliveryService.Modules.Orders.UnitTests.csproj"
            "Backend/src/Modules/RealTime/FoodDeliveryService.Modules.RealTime.UnitTests/FoodDeliveryService.Modules.RealTime.UnitTests.csproj"
            "Backend/src/Modules/Restaurants/FoodDeliveryService.Modules.Restaurants.UnitTests/FoodDeliveryService.Modules.Restaurants.UnitTests.csproj"
            "Backend/src/Modules/Users/FoodDeliveryService.Modules.Users.UnitTests/FoodDeliveryService.Modules.Users.UnitTests.csproj"
            "Backend/src/Modules/Notifications/FoodDeliveryService.Modules.Notifications.IntegrationTests/FoodDeliveryService.Modules.Notifications.IntegrationTests.csproj"
          )
          for project in "${projects[@]}"; do
            name=$(basename "$project" .csproj)
            echo "::group::$name"
            dotnet test "$project" --configuration Release --no-build --logger "trx;LogFileName=$name.trx"
            echo "::endgroup::"
          done

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: ignore

  tools:
    name: Tooling gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.7
        with:
          args: -color

      # Milestone A gates: the manifests are valid Kubernetes, and they have the shape this platform
      # decided on. Both are fast and need no cluster.
      - name: kubeconform (manifest schema)
        uses: docker://ghcr.io/yannh/kubeconform:v0.6.7
        with:
          args: -strict -summary -kubernetes-version 1.31.0 Backend/deploy/k8s

      - name: Manifest policy check
        run: |
          python3 -m pip install --quiet pyyaml
          python3 Backend/deploy/k8s/scripts/policy-check.py Backend/deploy/k8s

  cluster:
    name: KinD cluster smoke
    runs-on: ubuntu-latest
    # Builds eight .NET images and stands up the whole platform, so it takes far longer than the
    # rest of CI. It runs on pushes to the long-lived branches and on demand, not on every PR —
    # the two fast gates above already cover the manifests themselves.
    if: github.event_name != 'pull_request'
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # Same node topology and port mappings as a developer's local cluster — the config file is the
      # one source of truth for both.
      - name: Create KinD cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: fooddeliveryservice
          config: Backend/deploy/kind/kind-cluster.yaml

      # kind-up detects the cluster the action just created, then builds and loads all eight images
      # and applies the manifests. Scripts are invoked through bash so a missing exec bit on a
      # Windows-authored file cannot fail the job.
      - name: Build images and deploy (kind-up)
        run: bash Backend/deploy/kind/scripts/kind-up.sh

      - name: Smoke test the deployed platform
        run: bash Backend/deploy/k8s/scripts/cluster-smoke.sh

      - name: Dump cluster state on failure
        if: failure()
        run: |
          kubectl -n fooddeliveryservice get pods -o wide || true
          kubectl -n fooddeliveryservice describe pods || true
          kubectl -n fooddeliveryservice logs -l app.kubernetes.io/name=fooddeliveryservice-orders-api --tail=200 || true
          kubectl -n fooddeliveryservice logs -l app.kubernetes.io/name=fooddeliveryservice-identity --tail=200 || true

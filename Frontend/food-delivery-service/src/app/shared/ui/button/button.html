<button
  [type]="type()"
  [disabled]="disabled() || loading()"
  [attr.aria-busy]="loading()"
  [class]="classes()"
>
  <span class="btn__label"><ng-content /></span>

  @if (loading()) {
    <svg
      class="spinner"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2.5"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <path d="M12 3a9 9 0 1 0 9 9" />
    </svg>
  }
</button>

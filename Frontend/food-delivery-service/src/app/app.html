<div class="flex flex-col gap-6 p-6">
  <app-button variant="primary" size="md" type="button">Click me</app-button>

  <app-card [elevated]="true">
    <h3 class="text-[17px] font-bold">Trattoria Nono</h3>
    <p class="text-[13px] text-text-muted">Italian · Belgrade</p>
  </app-card>

  <app-card padding="none">
    <div card-header class="font-bold">With header and footer</div>
    <div class="p-4 text-sm">Body</div>
    <div card-footer class="text-xs text-text-muted">Footer</div>
  </app-card>

  <div class="flex flex-wrap gap-2">
    <app-badge tone="neutral">
      <svg
        badge-icon
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18M12 7v5l3 2" />
      </svg>
      Pending
    </app-badge>
    <app-badge tone="info">Preparing</app-badge>
    <app-badge tone="info" [dashed]="true">DriverAssigned</app-badge>
    <app-badge tone="success">Delivered</app-badge>
    <app-badge tone="warning" size="sm">Unassigned</app-badge>
    <app-badge tone="danger">Cancelled</app-badge>
    <app-badge shape="tag">ItemMissing</app-badge>
  </div>

  <div class="flex items-center gap-6">
    <app-spinner size="sm" />
    <app-spinner size="md" />
    <app-spinner size="lg" />
    <app-spinner label="Placing your order…" [showLabel]="true" />
  </div>
</div>
